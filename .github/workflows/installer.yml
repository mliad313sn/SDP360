name: Installer

# Builds SDP-Dashboard-Setup.exe on a clean Windows Server and runs the end-to-end test against it:
# silent new install on the runner's own PostgreSQL, Windows service, Manager CLI (status, restart,
# backup, restore with the typed phrase), repair, a failed health check rolled back, uninstall that
# keeps the data. Nothing here is published: the Setup.exe and the logs are kept as a run artifact.
# The runner's PostgreSQL is a throwaway cluster whose superuser password is the image default.

on:
  push:
    branches: ['**']
    paths:
      - 'tools/installer-v2/**'
      - 'tools/service/**'
      - 'tools/manager/**'
      - 'tools/sdp-manager.js'
      - 'tools/deploy/make-update-package.js'
      - 'services/updatePackage.js'
      - 'services/serviceControl.js'
      - 'services/dbRestore.js'
      - 'services/backup.js'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Inno Setup (when the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build Setup.exe
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          ./tools/installer-v2/build.ps1 -Version $v
      - name: End-to-end test
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $pw = if ($env:PGPASSWORD) { $env:PGPASSWORD } else { 'root' }
          ./tools/installer-v2/tests/e2e.ps1 -Setup "dist\SDP-Dashboard-Setup-$v.exe" -PgPassword $pw -LogDir dist\e2e-logs
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: installer
          path: |
            dist/SDP-Dashboard-Setup-*.exe
            dist/e2e-logs/
          if-no-files-found: warn
          retention-days: 14
