name: Installer

# Builds SDP-Dashboard-Setup.exe on a clean Windows Server and runs the end-to-end test against it twice:
# on a server with PostgreSQL already there, and on a BLANK server (the runner's PostgreSQL removed first,
# Setup installs its own). Each run: silent new install, Windows service, Manager CLI (status, restart,
# backup, restore with the typed phrase), repair, update (backup first), a failed health check rolled back, uninstall that
# keeps the data; plus upgrade-from-111 (A-03, a real 1.11 under pm2 upgraded then rolled back). Nothing here is published: the Setup.exe and the logs are kept as a run artifact.
# The runner's PostgreSQL is a throwaway cluster whose superuser password is the image default.

# Every push: the installer embeds the whole application, so any change can break a clean install.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Inno Setup (when the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build Setup.exe (Node.js, PostgreSQL 17, IIS URL Rewrite + ARR embedded)
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          ./tools/installer-v2/build.ps1 -Version $v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup
          path: dist/SDP-Dashboard-Setup-*.exe
          retention-days: 14

  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        machine: [existing-postgresql, blank]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: setup
          path: dist
      - name: End-to-end test (${{ matrix.machine }})
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\SDP-Dashboard-Setup-*.exe | Select-Object -First 1).FullName
          $pw = if ($env:PGPASSWORD) { $env:PGPASSWORD } else { 'root' }
          if ('${{ matrix.machine }}' -eq 'blank') { $pw = 'E2e-' + [guid]::NewGuid().ToString('N') }
          ./tools/installer-v2/tests/e2e.ps1 -Setup $setup -PgPassword $pw -LogDir dist\e2e-logs -Virgin:('${{ matrix.machine }}' -eq 'blank')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-logs-${{ matrix.machine }}
          path: dist/e2e-logs/
          if-no-files-found: warn
          retention-days: 14

  # A-03: a real 1.11 server (second checkout of the 1.11 line, its own node_modules built with the runner's
  # Node.js, running under pm2, one secret encrypted by the encrypt-secrets tool in tools/pg) upgraded by
  # Setup /MODE=update, then a fresh 1.11 tree with a forced health-check failure (SDP_SETUP_TEST_FAIL_PROBE=1)
  # that must come back as 1.11 under pm2. The .env of that throwaway server is generated at run time.
  upgrade-from-111:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: claude/confident-pascal-03veex
          path: v111
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install pm2 (the 1.x host)
        shell: pwsh
        run: npm i -g pm2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: setup
          path: dist
      - name: Upgrade from 1.11 under pm2, then a forced rollback
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\SDP-Dashboard-Setup-*.exe | Select-Object -First 1).FullName
          $pw = if ($env:PGPASSWORD) { $env:PGPASSWORD } else { 'root' }
          ./tools/installer-v2/tests/e2e.ps1 -Setup $setup -PgPassword $pw -UpgradeFrom v111 -Dir C:\SDP-E2E-111 -BackupDir C:\SDP-E2E-111-Backups -LogDir dist\e2e-logs-111
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-logs-upgrade-from-111
          path: dist/e2e-logs-111/
          if-no-files-found: warn
          retention-days: 14
