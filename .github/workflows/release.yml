name: Release

# Step 5 — on a version tag: test, build the update package (manifest + SHA-256 + Ed25519
# manifest signature), build SDP-Dashboard-Setup-<version>.exe with Inno Setup, Authenticode-sign
# the .exe when the certificate secrets exist (a zip cannot carry Authenticode: its integrity is
# the signed manifest, and the SIGNED Setup.exe embeds the very same zip), attach everything to
# the GitHub release. Unsigned artefacts are still published (marked as such in SIGNING.txt) so a
# release never waits on the certificate — but the Manager REFUSES an unsigned manifest unless the
# operator passes --allow-unsigned (logged).
#
# E1 rules enforced here (tests/ci-config.test.js fails if they regress):
#   - the signing condition is a JOB-level env (`SIGN`) computed from the secret, read by the
#     steps with `env.SIGN == 'true'` — a step-level `env:` is NOT visible to that step's own `if:`
#     (the previous `if: env.PFX != ''` was always false → every release said "signed: NO");
#   - the certificate password reaches signtool through `env:` of the Build Setup step ONLY, expanded
#     at run time inside a wrapper script — never written to GITHUB_ENV, never on a logged
#     command line (CLAUDE.md: a secret is never on a command line);
#   - the manifest signing key reaches the packager through `env:` of its step only;
#   - every action is pinned by commit SHA (tag kept as a comment), least-privilege permissions:
#     `contents: read` for the workflow, `contents: write` only on the publish job.
#
# Secrets (all optional — without them the release is published unsigned and says so):
#   SIGNING_CERT_PFX_BASE64, SIGNING_CERT_PASSWORD   Authenticode certificate for Setup.exe
#   SIGNING_MANIFEST_KEY                              Ed25519 private key, PKCS8 PEM, whose public
#                                                     half is committed as tools/manifest-public.pem

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      manifest_signed: ${{ steps.pkg.outputs.manifest_signed }}
    env:
      DASH_USER: ci-admin
      DASH_PASS: ci-password-0000!
      TZ: UTC
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_TESTS_REQUIRED: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: v
        name: Version = tag, must equal package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm audit --omit=dev --audit-level=high
      - name: Secret scan — a credential in the tracked files blocks the release (EX-01)
        run: node tools/security/secret-scan.js
      - run: node db/migrate.js
      - run: npm run build:check
      - run: npm test
      - id: pkg
        name: Build update package (manifest signed when SIGNING_MANIFEST_KEY is set)
        env:
          SIGNING_MANIFEST_KEY: ${{ secrets.SIGNING_MANIFEST_KEY }}
        run: |
          node tools/deploy/make-update-package.js --out dist --version "${{ steps.v.outputs.version }}" --commit "${GITHUB_SHA::7}"
          if node -e "process.exit(require('./dist/manifest.json').signature ? 0 : 1)"; then
            echo "manifest_signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "manifest_signed=no" >> "$GITHUB_OUTPUT"
          fi
      - name: SBOM (CycloneDX) of the shipped components
        run: node tools/release/sbom.js --out dist/sbom.cdx.json --timestamp
      - name: Manager accepts the freshly built package (signature + hashes)
        # Exactly what the server will run. Fails the release if the embedded public key does not
        # match the signing secret (or, unsigned, proves the refusal path still works).
        run: |
          if [ "${{ steps.pkg.outputs.manifest_signed }}" = "yes" ]; then
            node tools/sdp-manager.js verify "dist/sdp-dashboard-${{ steps.v.outputs.version }}.zip"
          else
            if node tools/sdp-manager.js verify "dist/sdp-dashboard-${{ steps.v.outputs.version }}.zip"; then echo "unsigned package must be refused"; exit 1; fi
            node tools/sdp-manager.js verify "dist/sdp-dashboard-${{ steps.v.outputs.version }}.zip" --allow-unsigned
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: package
          path: dist/

  installer:
    needs: package
    runs-on: windows-latest
    env:
      # Job-level flag: a step-level env is NOT visible to the step's own `if:`.
      SIGN: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: package
          path: dist
      - name: Install Inno Setup (when the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Import signing certificate (when configured)
        if: env.SIGN == 'true'
        env:
          PFX: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        shell: pwsh
        run: |
          # The certificate goes to a temp file; the PASSWORD is NOT handled here — it is passed as
          # env to the ISCC step and read by the wrapper below at run time (never logged).
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:PFX))
          $wrapper = @'
          @echo off
          signtool sign /f "%RUNNER_TEMP%\sign.pfx" /p "%SIGNING_CERT_PASSWORD%" /tr http://timestamp.digicert.com /td sha256 /fd sha256 %1
          '@
          Set-Content -Path "$env:RUNNER_TEMP\sdp-sign.cmd" -Value $wrapper -Encoding ascii
          Get-Command signtool -ErrorAction SilentlyContinue | Out-Null
          if (-not $?) { echo "signtool not on PATH" ; exit 1 }
      - name: Build Setup.exe
        shell: pwsh
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $v = "${{ needs.package.outputs.version }}"
          # build.ps1 bundles Node.js (checksum-verified), the Windows dependencies, the service host and the
          # Manager around the package the previous job built and signed — it never rebuilds the package.
          $sign = ''
          if ($env:SIGN -eq 'true') { $sign = "$env:RUNNER_TEMP\sdp-sign.cmd" }
          ./tools/installer-v2/build.ps1 -Version $v -PackageZip "dist\sdp-dashboard-$v.zip" -SignTool $sign -Commit "$env:GITHUB_SHA".Substring(0, 7)
      - name: Note signing state
        shell: pwsh
        run: |
          $exe = if ($env:SIGN -eq 'true') { "signed: YES (Authenticode)" } else { "signed: NO (SIGNING_CERT_PFX_BASE64 not set)" }
          $mf  = if ("${{ needs.package.outputs.manifest_signed }}" -eq 'yes') { "manifest signed: YES (ed25519, tools/manifest-public.pem)" } else { "manifest signed: NO (SIGNING_MANIFEST_KEY not set) - the Manager refuses this package without --allow-unsigned" }
          @("Setup.exe $exe", $mf) | Tee-Object dist\SIGNING.txt
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-files
          path: |
            dist/sdp-dashboard-*.zip
            dist/sdp-dashboard-*.zip.sha256
            dist/manifest.json
            dist/SDP-Dashboard-Setup-*.exe
            dist/SIGNING.txt

  publish:
    needs: [package, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that writes to the repository (release assets)
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-files
          path: dist
      - uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist/sdp-dashboard-*.zip
            dist/sdp-dashboard-*.zip.sha256
            dist/manifest.json
            dist/SDP-Dashboard-Setup-*.exe
            dist/SIGNING.txt
          generate_release_notes: true
