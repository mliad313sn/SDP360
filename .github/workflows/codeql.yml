name: CodeQL (SAST)

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
