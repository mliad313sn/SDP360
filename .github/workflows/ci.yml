name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # reports-db refuses first boot without a bootstrap admin; throwaway values for the CI sqlite DBs.
      DASH_USER: ci-admin
      DASH_PASS: ci-password-0000!
      TZ: UTC
      # Step 2 — the pg half of the suite MUST run (PG_TESTS_REQUIRED turns a skip into a failure).
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_TESTS_REQUIRED: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply schema migrations on a fresh database (installer/CI path)
        run: node db/migrate.js && node db/migrate.js --status
      - run: npm test
