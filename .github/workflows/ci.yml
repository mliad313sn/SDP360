# Step 2 (SDP-DASH-2.0) — continuous integration. Every push and pull request on main:
#   1. syntax gate (every .js file + every inline page script)
#   2. schema migrator applied to an EMPTY PostgreSQL 17, then replayed (must be a no-op)
#   3. the whole test suite — sqlite AND PostgreSQL (PG_TESTS_REQUIRED=1: a skipped pg test fails)
#   4. SAST (ESLint + eslint-plugin-security, eslint.config.js) and dependency audit — both GATES
#      since step 4: any error / any high or critical vulnerability fails the build
# No production secret is used: the database is a throwaway service container.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sdp_dashboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # pg tests isolate themselves in a throwaway SCHEMA of this database (tests/pg-helpers.js),
      # exactly as on the dev box — no PG_ADMIN_URL, no per-test database.
      PG_URL: postgres://postgres:ci-only-password@localhost:5432/sdp_dashboard
      PG_TESTS_REQUIRED: '1'
      # The local .env provides these on the dev box; CI has no .env. Test-only values.
      DASH_USER: ci-admin
      DASH_PASS: ci-admin-password-0000
      DASHBOARD_API_KEY: ci-dashboard-key
      ZOHO_CLIENT_ID: ci-dummy
      ZOHO_CLIENT_SECRET: ci-dummy
      ZOHO_REFRESH_TOKEN: ci-dummy
      TZ: UTC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pg_dump must match the server major version (17); the runner ships 16.
      - name: PostgreSQL 17 client (pg_dump / psql for the backup + restore drill test)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Syntax gate
        run: node tools/ci/lint.js

      - name: SAST (ESLint security rules)
        run: npx eslint .

      - name: Compiled JSX is up to date (step 5 - no compilation in the browser)
        run: node tools/build/build-frontend.js --check

      - name: Dependency audit (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

      - name: Schema migrator on an empty database
        run: |
          node db/migrate.js --apply
          node db/migrate.js --status | tee migrate-status.txt
          if grep -Eq "pending=[1-9]|changed=[1-9]" migrate-status.txt; then echo "replay is not a no-op"; exit 1; fi

      - name: Test suite (sqlite + PostgreSQL) with coverage
        # tools/test/run-all.js = --test-force-exit + blocking stdio + per-file guard (F-M01-004)
        run: node tools/test/run-all.js --experimental-test-coverage --test-coverage-include='**/*.js' --test-coverage-exclude='tests/**' --test-coverage-exclude='node_modules/**' 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 14
