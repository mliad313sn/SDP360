name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # reports-db refuses first boot without a bootstrap admin; throwaway values for the CI sqlite DBs.
      DASH_USER: ci-admin
      DASH_PASS: ci-password-0000!
      TZ: UTC
      # Step 2 — the pg half of the suite MUST run (PG_TESTS_REQUIRED turns a skip into a failure).
      PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      PG_TESTS_REQUIRED: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (SCA) — fails on high/critical
        run: npm audit --omit=dev --audit-level=high
      - name: Apply schema migrations on a fresh database (installer/CI path)
        run: node db/migrate.js && node db/migrate.js --status
      - name: Front-end bundles are up to date (esbuild, no in-browser Babel)
        run: npm run build:check
      - name: SAST (ESLint security rules, blocking)
        run: npm run lint
      - run: npm test
