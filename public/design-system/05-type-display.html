<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — Display type</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:24px}
  .display{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:-0.02em;line-height:1.02;font-size:64px;color:#1a1a1a;margin:0}
  .h1{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:-0.015em;font-size:34px;line-height:1.05;margin:14px 0 0}
  .sub{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--edv-blue);margin:0 0 6px}
</style></head>
<body>
  <div class="sub">Display — Libre Franklin (sub. Franklin Gothic)</div>
  <p class="display">Mining gold,<br>building futures.</p>
  <p class="h1">Our purpose is to produce gold<br>that delivers meaningful value.</p>
</body></html>
