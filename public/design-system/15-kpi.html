<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — KPI / data block</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:22px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
  .k{padding:6px 0;border-top:3px solid var(--c,#145fae)}
  .k .v{font-family:var(--font-display);font-size:36px;font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--c,#145fae)}
  .k .u{font-family:var(--font-display);font-size:13px;color:var(--c,#145fae);font-weight:700;margin-left:2px}
  .k .l{font-family:var(--font-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#3a4a60;margin-top:8px;font-weight:700}
  .k .s{font-family:var(--font-body);font-size:11px;color:var(--fg-3);margin-top:4px}
</style></head>
<body>
  <div class="grid">
    <div class="k" style="--c:#145fae"><div class="v">8,143</div><div class="l">Employees</div><div class="s">Across 6 countries</div></div>
    <div class="k" style="--c:#ef631a"><div class="v">1.6<span class="u">Moz</span></div><div class="l">FY-2023 production</div><div class="s">Gold</div></div>
    <div class="k" style="--c:#1b9a3a"><div class="v">78<span class="u">%</span></div><div class="l">Water recycled</div><div class="s">Process intake</div></div>
    <div class="k" style="--c:#ffcd18"><div class="v">$42<span class="u">m</span></div><div class="l">Community investment</div><div class="s">FY-2023</div></div>
  </div>
</body></html>
