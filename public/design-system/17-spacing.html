<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — Spacing scale</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:18px;font-family:var(--font-body)}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .bar{background:#3a4a60;height:14px;border-radius:2px}
  .lab{font-family:var(--font-mono);font-size:11px;color:#3a4a60;width:120px}
  .px{font-family:var(--font-body);font-size:11px;color:var(--fg-3)}
</style></head>
<body>
  <div class="row"><span class="lab">--space-1</span><span class="bar" style="width:4px"></span><span class="px">4 px</span></div>
  <div class="row"><span class="lab">--space-2</span><span class="bar" style="width:8px"></span><span class="px">8 px</span></div>
  <div class="row"><span class="lab">--space-3</span><span class="bar" style="width:12px"></span><span class="px">12 px</span></div>
  <div class="row"><span class="lab">--space-4</span><span class="bar" style="width:16px"></span><span class="px">16 px</span></div>
  <div class="row"><span class="lab">--space-5</span><span class="bar" style="width:24px"></span><span class="px">24 px</span></div>
  <div class="row"><span class="lab">--space-6</span><span class="bar" style="width:32px"></span><span class="px">32 px</span></div>
  <div class="row"><span class="lab">--space-7</span><span class="bar" style="width:48px"></span><span class="px">48 px</span></div>
  <div class="row"><span class="lab">--space-8</span><span class="bar" style="width:64px"></span><span class="px">64 px</span></div>
  <div class="row"><span class="lab">--space-9</span><span class="bar" style="width:96px"></span><span class="px">96 px</span></div>
</body></html>
