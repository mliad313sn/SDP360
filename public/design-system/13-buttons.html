<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — Buttons</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:12px 20px;border-radius:2px;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all .18s cubic-bezier(.2,0,0,1)}
  .btn.primary{background:#145fae;color:#fff}
  .btn.primary:hover{background:#08629e}
  .btn.secondary{background:transparent;color:#145fae;border:1.5px solid #145fae}
  .btn.secondary:hover{background:#145fae;color:#fff}
  .btn.ghost{background:transparent;color:#3a4a60;padding-left:0}
  .btn.cta{background:#ef631a;color:#fff}
  .btn.cta:hover{background:#ca6419}
  .btn .ar{display:inline-block;width:14px;height:1.5px;background:currentColor;position:relative}
  .btn .ar::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:rotate(45deg)}
  .lab{font-family:var(--font-body);font-size:11px;color:var(--fg-3);min-width:110px}
</style></head>
<body>
  <div class="row"><span class="lab">Primary</span><button class="btn primary">View report <span class="ar"></span></button><button class="btn primary" disabled style="opacity:.4">Disabled</button></div>
  <div class="row"><span class="lab">Secondary</span><button class="btn secondary">Investor centre</button></div>
  <div class="row"><span class="lab">CTA · Pillar</span><button class="btn cta">Speak Up</button></div>
  <div class="row"><span class="lab">Ghost</span><button class="btn ghost">Read more <span class="ar"></span></button></div>
</body></html>
