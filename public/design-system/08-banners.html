<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — Banners</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:14px;display:grid;grid-template-columns:1fr;gap:8px}
  .b{width:100%;height:62px;background-size:cover;background-position:center;border-radius:2px;position:relative;overflow:hidden;display:flex;align-items:center;padding:0 18px;color:#fff;font-family:var(--font-display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
  .b span{position:relative;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4)}
</style></head>
<body>
  <div class="b" style="background-image:url(../assets/banners/corporate.png)"><span>Corporate</span></div>
  <div class="b" style="background-image:url(../assets/banners/employees.png)"><span>Our Employees</span></div>
  <div class="b" style="background-image:url(../assets/banners/health-safety.png)"><span>Health &amp; Safety</span></div>
  <div class="b" style="background-image:url(../assets/banners/communities.png)"><span>Our Communities</span></div>
  <div class="b" style="background-image:url(../assets/banners/environment.png)"><span>Our Environment</span></div>
  <div class="b" style="background-image:url(../assets/banners/ethical-business.png)"><span>Ethical Business</span></div>
</body></html>
