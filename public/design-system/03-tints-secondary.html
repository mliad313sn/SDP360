<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — Secondary &amp; tints</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:18px}
  h4{font-family:var(--font-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);margin:0 0 6px}
  .row{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:14px}
  .s{aspect-ratio:1;border-radius:4px;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px;font-family:var(--font-display);font-size:9px;color:#fff;letter-spacing:.04em;text-transform:uppercase}
  .lt{color:#1a1a1a}
</style></head>
<body>
  <h4>Secondary</h4>
  <div class="row" style="grid-template-columns:repeat(3,1fr)">
    <div class="s" style="background:#73c9db">Sky #73c9db</div>
    <div class="s lt" style="background:#c5c6c4">Light grey #c5c6c4</div>
    <div class="s" style="background:#d90038">Red #d90038</div>
  </div>
  <h4>Tints — 100 / 75 / 50</h4>
  <div class="row">
    <div class="s" style="background:#145fae">100</div><div class="s" style="background:#5e8dca">75</div><div class="s lt" style="background:#8fabd9">50</div>
    <div class="s" style="background:#ef631a">100</div><div class="s" style="background:#f79853">75</div><div class="s lt" style="background:#fbb885">50</div>
    <div class="s lt" style="background:#ffcd18">100</div><div class="s lt" style="background:#ffde66">75</div>
  </div>
  <div class="row">
    <div class="s" style="background:#1b9a3a">100</div><div class="s" style="background:#69b76f">75</div><div class="s lt" style="background:#9bcb9a">50</div>
    <div class="s" style="background:#3a4a60">100</div><div class="s" style="background:#70798b">75</div><div class="s lt" style="background:#979bab">50</div>
    <div class="s" style="background:#524f4e">100</div><div class="s" style="background:#827d7d">75</div>
  </div>
</body></html>
