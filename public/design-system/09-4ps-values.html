<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — 4Ps Values</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:18px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .p{padding:14px;border-radius:var(--radius-md);color:#fff;font-family:var(--font-display)}
  .p .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
  .p .n{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
  .p .d{font-family:var(--font-body);font-size:11px;line-height:1.35;margin-top:8px;opacity:.95}
  .lt{color:#1a1a1a}
</style></head>
<body>
  <div class="grid">
    <div class="p" style="background:#145fae"><div class="l">P · 01</div><div class="n">Partners</div><div class="d">Working together for a shared goal</div></div>
    <div class="p" style="background:#ef631a"><div class="l">P · 02</div><div class="n">Performers</div><div class="d">Striving to be the best</div></div>
    <div class="p lt" style="background:#ffcd18"><div class="l">P · 03</div><div class="n">Pioneers</div><div class="d">Thinking outside the box</div></div>
    <div class="p" style="background:#1b9a3a"><div class="l">P · 04</div><div class="n">Proactive</div><div class="d">Going beyond to achieve more</div></div>
  </div>
</body></html>
