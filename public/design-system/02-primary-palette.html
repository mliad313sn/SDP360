<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — Primary palette</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body { padding: 20px; }
  .grid { display:grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .sw { aspect-ratio: 1/1.05; border-radius: var(--radius-md); padding: 10px; display:flex; flex-direction:column; justify-content:flex-end; color:#fff; font-family: var(--font-display); }
  .sw .h { font-size: 10px; letter-spacing:.1em; text-transform:uppercase; opacity:.85; }
  .sw .v { font-size: 12px; font-weight:700; letter-spacing:.04em; }
  .sw.lt { color: #1a1a1a; }
</style></head>
<body>
  <div class="grid">
    <div class="sw" style="background:#145fae"><div class="h">Blue</div><div class="v">#145fae</div></div>
    <div class="sw" style="background:#ef631a"><div class="h">Orange</div><div class="v">#ef631a</div></div>
    <div class="sw lt" style="background:#ffcd18"><div class="h">Yellow</div><div class="v">#ffcd18</div></div>
    <div class="sw" style="background:#1b9a3a"><div class="h">Green</div><div class="v">#1b9a3a</div></div>
    <div class="sw" style="background:#3a4a60"><div class="h">Slate</div><div class="v">#3a4a60</div></div>
    <div class="sw" style="background:#524f4e"><div class="h">Warm Grey</div><div class="v">#524f4e</div></div>
  </div>
</body></html>
