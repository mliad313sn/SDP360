<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><title>EDV — Pillar colours</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  body{padding:18px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .p{aspect-ratio:1;border-radius:var(--radius-md);padding:10px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-display)}
  .lt{color:#1a1a1a}
  .p .pl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
  .p .nm{font-size:13px;font-weight:700;line-height:1.05;text-transform:uppercase}
  .p .hx{font-size:10px;letter-spacing:.06em}
</style></head>
<body>
  <div class="grid">
    <div class="p" style="background:#145fae"><div class="pl">Pillar 01</div><div><div class="nm">Our<br>Employees</div><div class="hx">#145fae</div></div></div>
    <div class="p" style="background:#ef631a"><div class="pl">Pillar 02</div><div><div class="nm">Health &amp; Safety</div><div class="hx">#ef631a</div></div></div>
    <div class="p lt" style="background:#ffcd18"><div class="pl">Pillar 03</div><div><div class="nm">Our<br>Communities</div><div class="hx">#ffcd18</div></div></div>
    <div class="p" style="background:#1b9a3a"><div class="pl">Pillar 04</div><div><div class="nm">Our<br>Environment</div><div class="hx">#1b9a3a</div></div></div>
    <div class="p" style="background:#3a4a60"><div class="pl">Pillar 05</div><div><div class="nm">Ethical<br>Business</div><div class="hx">#3a4a60</div></div></div>
  </div>
</body></html>
