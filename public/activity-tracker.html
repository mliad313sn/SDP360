<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Activity Tracker — Endeavour Mining</title>

<!-- Auth gate. Sets window.__authUser + window.__userHasRole before
     the app boots. -->
<script src="auth.js" data-require="any"></script>

<!-- Canonical EDV brand tokens (matches every other live page). -->
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_shell.css">
<link rel="stylesheet" href="brand/icons.css">
<link rel="stylesheet" href="activity-tracker/styles.css">

<!-- Production header chrome — rendered by _shell.js into #__shell. -->
<script src="brand/icons.js" defer></script>
<script src="_shell.js" defer></script>

<!-- Charting (used by the Dashboard panel). -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<!-- Scoring engine + API wrappers — pure JS, defined on window.TR /
     window.TRApi. Calculation formulas ported verbatim from the
     legacy file so existing scores stay identical. -->
<script src="activity-tracker/engine.js"></script>
<script src="activity-tracker/api.js"></script>
<script src="lib/trackerMonthLock.js"></script>

<!-- React (production build) via CDN. The JSX is compiled ahead of time by
     tools/build/build-frontend.js (npm run build): no Babel, no eval in the browser. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
</head>
<body>

<!-- Shell renders the global header (logo, nav, user menu, breadcrumb).
     data-current="tracker" makes the Activity Tracker nav entry
     highlight as active. -->
<div id="__shell" data-section="operations" data-current="tracker"></div>

<!-- React mounts here. App.jsx pulls /api/tracker/load on boot, shows
     a "Loading…" splash until the data arrives, then swaps in the
     toolbar + tab strip + active panel. -->
<div id="tracker-root"></div>

<!-- The React app, compiled from App.jsx (npm run build — never edit App.js by hand). -->
<script src="activity-tracker/App.js"></script>

</body>
</html>
