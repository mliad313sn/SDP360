<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Activity Tracker — Endeavour Mining</title>

<!-- Auth gate. Sets window.__authUser + window.__userHasRole before
     the app boots. -->
<script src="auth.js" data-require="any"></script>

<!-- Canonical EDV brand tokens (matches every other live page). -->
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="_shell.css">
<link rel="stylesheet" href="brand/icons.css">
<link rel="stylesheet" href="activity-tracker/styles.css">

<!-- Production header chrome — rendered by _shell.js into #__shell. -->
<script src="brand/icons.js" defer></script>
<script src="_shell.js" defer></script>

<!-- Charting (used by the Dashboard panel) — same-origin, see public/vendor/. -->
<script src="vendor/chart.js/4.4.1/chart.umd.js"></script>
<script src="lib/chartTheme.js"></script>

<!-- Scoring engine + API wrappers — pure JS, defined on window.TR /
     window.TRApi. Calculation formulas ported verbatim from the
     legacy file so existing scores stay identical. -->
<script src="lib/kpiRag.js"></script>
<script src="activity-tracker/engine.js"></script>
<script src="activity-tracker/api.js"></script>
<script src="lib/trackerMonthLock.js"></script>

<!-- React + ReactDOM UMD production builds, served same-origin from
     public/vendor/ (B-01) — the tracker renders with no Internet access.
     App.jsx is pre-built by esbuild (no in-browser Babel). -->
<script src="vendor/react/18.3.1/react.production.min.js"></script>
<script src="vendor/react-dom/18.3.1/react-dom.production.min.js"></script>
</head>
<body>

<!-- Shell renders the global header (logo, nav, user menu, breadcrumb).
     data-current="tracker" makes the Activity Tracker nav entry
     highlight as active. -->
<div id="__shell" data-section="operations" data-current="tracker"></div>

<!-- React mounts here. App.jsx pulls /api/tracker/load on boot, shows
     a "Loading…" splash until the data arrives, then swaps in the
     toolbar + tab strip + active panel. -->
<div id="tracker-root"></div>

<!-- The React app itself, written in JSX (Babel compiles in-browser). -->
<!-- Step 5: App.jsx is transpiled ahead of time by tools/build/build-frontend.js (esbuild) — no in-browser Babel -->
<script src="activity-tracker/dist/app.js"></script>

<!-- A-09a — French dictionary, INERT unless report_config ui_i18n_pages='1' (boot.js checks window.__uiPolicy). -->
<script src="lib/i18nText.js"></script>
<script src="lib/i18n/common.fr.js"></script>
<script src="lib/i18n/activity-tracker.fr.js"></script>
<script src="lib/i18n/boot.js" data-dict="I18N_FR_ACTIVITY_TRACKER" data-root="tracker-root"></script>

</body>
</html>
