<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAN Health — Endeavour Mining IT</title>

<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="brand/icons.css">
<link rel="stylesheet" href="brand/components.css">
<link rel="stylesheet" href="_shell.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
<script nonce="%%CSP_NONCE%%" src="brand/icons.js"></script>
<script nonce="%%CSP_NONCE%%" src="auth.js" data-require="any" data-redirect="login.html"></script>
<script nonce="%%CSP_NONCE%%" src="_shell.js"></script>

<style nonce="%%CSP_NONCE%%">
  body { margin:0; background:var(--color-background,#f4f6f7); color:var(--color-text-primary,#1F2A33);
    font-family:var(--font-sans,'Libre Franklin',system-ui,sans-serif); font-size:14px; }
  .wh-wrap { max-width:1280px; margin:0 auto; padding:var(--space-6,24px); }
  .wh-head { display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
  .wh-head h1 { margin:0; font-size:22px; font-weight:700; color:var(--edv-slate,#3A4A60); }
  .wh-head .sub { font-size:13px; color:var(--color-text-muted,#6b7785); }
  .wh-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-left:auto; }
  select, .wh-btn { padding:7px 12px; border:1px solid #cfd6e0; border-radius:8px; background:#fff; font-size:13px; cursor:pointer; }
  .wh-toggle button { border:1px solid #cfd6e0; background:#fff; padding:7px 12px; cursor:pointer; }
  .wh-toggle button:first-child { border-radius:8px 0 0 8px; } .wh-toggle button:last-child { border-radius:0 8px 8px 0; border-left:0; }
  .wh-toggle button.on { background:var(--edv-slate,#3A4A60); color:#fff; border-color:var(--edv-slate,#3A4A60); }
  .wh-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-bottom:22px; }
  .wh-card { background:#fff; border:1px solid #e4e8ee; border-radius:12px; padding:14px 16px; }
  .wh-card h3 { margin:0 0 10px; font-size:15px; color:var(--edv-slate,#3A4A60); }
  .wh-link { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid #f0f2f5; }
  .wh-link:first-of-type { border-top:0; }
  .wh-dot { width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
  .g{background:#27AE60}.o{background:#E8A100}.r{background:#DC2626}.n{background:#b6bdc7}
  .wh-up { font-weight:700; min-width:44px; } .wh-lbl { color:#6b7785; min-width:52px; }
  .wh-q { color:#6b7785; font-size:12px; margin-left:auto; }
  .wh-subhdr { font-size:11px; font-weight:700; color:#556; margin:6px 0 2px; text-transform:uppercase; letter-spacing:.03em; }
  .wh-panel { background:#fff; border:1px solid #e4e8ee; border-radius:12px; padding:16px; }
  .wh-empty { background:#fff7ed; border:1px solid #f0c9a0; color:#7a3d12; border-radius:12px; padding:16px; }
  .wh-note { font-size:12px; color:#6b7785; margin-top:6px; }
</style>
</head>
<body>
<div id="__shell" data-section="performance" data-current="wan-health"></div>

<div class="wh-wrap">
  <div class="wh-head">
    <div>
      <h1>WAN Health</h1>
      <div class="sub">Per-site WAN availability &amp; quality — archived from Meraki (kept beyond Meraki's ~60-day window)</div>
    </div>
    <div class="wh-controls">
      <div class="wh-toggle" id="wh-period">
        <button data-p="week" class="on">Weekly</button><button data-p="month">Monthly</button>
      </div>
      <button class="wh-btn" id="wh-sync" style="display:none">⚡ Sync now</button>
    </div>
  </div>

  <div id="wh-empty" class="wh-empty" style="display:none">
    No WAN snapshots yet. Set <b>meraki_api_key</b> in Admin → config and run the sync (nightly, or the <b>Sync now</b> button). Numbers become trustworthy once the calibration step is done.
  </div>

  <div id="wh-grid" class="wh-grid"></div>

  <div class="wh-panel">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">
      <b>Trend</b>
      <select id="wh-site"></select>
      <span class="wh-q" id="wh-trend-note"></span>
    </div>
    <div style="position:relative;height:340px"><canvas id="wh-chart"></canvas></div>
  </div>
</div>

<script nonce="%%CSP_NONCE%%">
(function () {
  let period = 'week', chart = null, sites = [];
  const $ = id => document.getElementById(id);
  const dotClass = c => c === 'green' ? 'g' : c === 'orange' ? 'o' : c === 'red' ? 'r' : 'n';
  const fmt = v => v == null ? '—' : (typeof v === 'number' ? (Math.round(v * 10) / 10) : v);

  async function api(path) {
    const h = {}; const at = window.__authToken; if (at) h['x-report-token'] = at;
    const r = await fetch(path, { headers: h });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function loadSummary() {
    let data; try { data = await api('/api/analytics/wan/summary?period=' + period); } catch { data = { sites: [] }; }
    sites = data.sites || [];
    $('wh-empty').style.display = sites.length ? 'none' : 'block';
    const linkRow = u => `
          <div class="wh-link">
            <span class="wh-dot ${dotClass(u.status_color)}"></span>
            <span class="wh-lbl">${u.uplink_label || u.uplink}</span>
            <span class="wh-up">${u.availability_pct == null ? '—' : fmt(u.availability_pct) + '%'}</span>
            <span class="wh-q">loss ${fmt(u.loss_pct_avg)}% · ${fmt(u.latency_ms_avg)}ms · jit ${fmt(u.jitter_ms_avg)}ms</span>
          </div>`;
    $('wh-grid').innerHTML = sites.map(s => {
      const uplinks = s.uplinks || [];
      const groups = {};
      uplinks.forEach(u => { const k = u.sub_site || ''; (groups[k] = groups[k] || []).push(u); });
      const keys = Object.keys(groups);
      let body;
      if (keys.length === 1 && keys[0] === '') {
        body = uplinks.map(linkRow).join('');
      } else {
        body = keys.filter(k => k !== '').sort().map(k =>
          `<div class="wh-subhdr">${k}</div>` + groups[k].map(linkRow).join('')
        ).join('');
      }
      return `
      <div class="wh-card">
        <h3>${s.site_name || ('Site ' + s.site_id)}</h3>
        ${body}
      </div>`;
    }).join('');
    // populate the site selector (keep current if still present)
    const sel = $('wh-site'), cur = sel.value;
    sel.innerHTML = sites.map(s => `<option value="${s.site_id}">${s.site_name || ('Site ' + s.site_id)}</option>`).join('');
    if (cur && sites.some(s => String(s.site_id) === cur)) sel.value = cur;
    if (sel.value) loadTrend(sel.options[sel.selectedIndex].text);
    else { if (chart) { chart.destroy(); chart = null; } $('wh-trend-note').textContent = ''; }
  }

  async function loadTrend(siteName) {
    if (!$('wh-site').value) return;
    let data; try { data = await api('/api/analytics/wan/trend?period=' + period + '&site=' + encodeURIComponent(siteName)); } catch { data = { series: [] }; }
    const series = data.series || [];
    $('wh-trend-note').textContent = series.length ? `${series.length} uplink(s) · ${period}` : 'no data for this site';
    const labels = [...new Set(series.flatMap(s => s.points.map(p => p.period_start)))].sort();
    const colors = { wan1: '#2A5490', wan2: '#E8A100', wan3: '#6D2E46' };
    if (typeof Chart === 'undefined') return;
    if (chart) chart.destroy();
    chart = new Chart($('wh-chart').getContext('2d'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          ...series.map(s => ({ label: (s.sub_site ? s.sub_site + ' ' : '') + (s.uplink || '') + ' availability %', yAxisID: 'y',
            data: labels.map(l => { const p = s.points.find(x => x.period_start === l); return p ? p.availability_pct : null; }),
            borderColor: colors[s.uplink] || '#3A4A60', backgroundColor: 'transparent', spanGaps: false, tension: 0.2 })),
          ...series.map(s => ({ label: (s.sub_site ? s.sub_site + ' ' : '') + (s.uplink || '') + ' loss %', yAxisID: 'y1', borderDash: [4, 3],
            data: labels.map(l => { const p = s.points.find(x => x.period_start === l); return p ? p.loss_pct_avg : null; }),
            borderColor: colors[s.uplink] || '#999', backgroundColor: 'transparent', spanGaps: false, tension: 0.2 })),
        ],
      },
      options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        scales: { y: { title: { display: true, text: 'Availability %' }, suggestedMin: 90, suggestedMax: 100 },
          y1: { position: 'right', title: { display: true, text: 'Loss %' }, grid: { drawOnChartArea: false }, suggestedMin: 0 } } },
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    $('wh-period').addEventListener('click', function (e) {
      const b = e.target.closest('button'); if (!b) return;
      period = b.dataset.p;
      [...this.children].forEach(x => x.classList.toggle('on', x === b));
      loadSummary();
    });
    $('wh-site').addEventListener('change', function () { loadTrend(this.options[this.selectedIndex].text); });
    if (window.__userHasRole && (window.__userHasRole('admin') || window.__userHasRole('super_admin'))) {
      const btn = $('wh-sync'); btn.style.display = '';
      btn.addEventListener('click', async function () {
        btn.disabled = true; btn.textContent = '⏳ Syncing…';
        try { await fetch('/api/analytics/wan/sync', { method: 'POST', headers: window.__authToken ? { 'x-report-token': window.__authToken } : {} }); } catch {}
        btn.disabled = false; btn.textContent = '⚡ Sync now'; loadSummary();
      });
    }
    loadSummary();
  });
})();
</script>
</body>
</html>
