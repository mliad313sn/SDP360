<title>IT Business Review · Endeavour Mining Group IT</title>
<!--
  it-review.html — the live IT Review dashboard.

  The BODY MARKUP below is carried across from the authoritative template
  (docs/reference/it-review-dashboard.template.html) — his 15 panels, his
  wording, his 219 bindings, his 32 <sc-for> / 3 <sc-if>. It is rendered by
  public/it-review.js's 3-primitive renderer against the 61-key object
  GET /api/reports/review-data returns. Deliberately NO dc-runtime, NO React,
  NO Babel, NO CDN, NO remote fonts — zero external requests.

  What we changed, and why (each is mechanical):
    · his 9 web-font rules + their blob sources   -> dropped (we don't have them)
    · his 2 <script src="<blob>"> (the dc-runtime) -> dropped (we ported the logic)
    · sc-raw-{table,thead,tbody,tr,th,td}          -> the real tags
    · sc-camel-view-box / -preserve-aspect-ratio   -> viewBox / preserveAspectRatio
    · the 4 on-click "pick" closures               -> links (the page is stateless;
      changing a control navigates). 3B-2a dropped "pick" and emits "key".
    · his 12 screen-label + 35 placeholder-hint attrs -> stripped (authoring-only)
    · two disclosures added (score window; what ?asOf= actually moves)

  The template lives in a <script type="text/html"> on purpose: the HTML parser
  never touches it, so the <table>/<svg> markup inside reaches the renderer as
  raw text and is only parsed once, on assignment to #review-root.innerHTML.
-->

/* Modernist — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #ec3013;
  --color-accent-2: #e15b47;
  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #fff2ef;
  --color-accent-200: #ffe0d9;
  --color-accent-300: #ffc4b8;
  --color-accent-400: #ff9783;
  --color-accent-500: #ff563c;
  --color-accent-600: #dd2b0f;
  --color-accent-700: #ae1800;
  --color-accent-800: #7c1405;
  --color-accent-900: #4d170e;

  --color-accent-2-100: #fff2ef;
  --color-accent-2-200: #ffe0da;
  --color-accent-2-300: #ffc4b9;
  --color-accent-2-400: #ff9784;
  --color-accent-2-500: #ef6853;
  --color-accent-2-600: #c94b39;
  --color-accent-2-700: #9e3526;
  --color-accent-2-800: #71261b;
  --color-accent-2-900: #471d16;

  --font-heading: "Archivo", system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: "Archivo", system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.grayscale{filter:grayscale(1) contrast(1.08)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 2px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid var(--color-divider);
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--color-divider);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }



    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
    a { color: var(--color-accent-700); } a:hover { color: var(--color-accent); }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .brief-page { border: none !important; }
    }

    /* --- ours: three small additions on top of his system --- */
    /* style-hover is his runtime's hover shorthand; all 3 uses are opacity:0.85. */
    [style-hover]:hover { opacity: 0.85; }
    .disclosure { font-size: 12px; line-height: 1.5; color: var(--color-neutral-600);
                  margin-top: 6px; max-width: 96ch; }
    .disclosure code { font-size: 11px; background: var(--color-neutral-200); padding: 1px 4px; }
    #review-fallback { padding: 32px; font-size: 14px; }
    /* Back link. This page deliberately mounts NO app shell (it is opened with
       target:'_blank' from the Insights menu — see _shell.js), but a user who
       arrives by bookmark or a pasted URL is otherwise trapped. Fixed + floating
       so it disturbs neither the sticky header nor the panel grid, and it lives
       OUTSIDE #review-template: the renderer overwrites #review-root.innerHTML,
       so anything placed inside would be destroyed on first render. It carries
       none of the renderer's three primitives (moustache bindings, sc-for,
       sc-if) — and it-review.js reads only review-template.innerHTML anyway. */
    .rv-back {
      position: fixed; left: 16px; bottom: 16px; z-index: 60;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 600; text-decoration: none;
      color: var(--color-neutral-700, #374151);
      background: #fff; border: 1px solid var(--color-divider, #E5E7EB);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .rv-back:hover { color: #111827; background: #F9FAFB; }
</style>
</head>
<body>

<!-- Top banner — same shell as every other page (replaces the old floating
     back pill; the banner's brand mark is the way home). -->
<div id="__shell" data-section="executive" data-current="it-review"></div>

<div id="review-root"><div id="review-fallback">Loading the IT Review&hellip;</div></div>

<script type="text/html" id="review-template">

<div style="min-height:100vh">

  <!-- ============ HEADER ============ -->
  <div class="no-print" style="display:flex; align-items:center; gap:24px; padding:16px 32px; border-bottom:2px solid var(--color-divider); background:var(--color-bg); position:static; flex-wrap:wrap">
    <div style="display:flex; align-items:baseline; gap:12px">
      <div style="width:14px; height:14px; background:var(--color-accent); align-self:center"></div>
      <div style="font-family:var(--font-heading); font-weight:700; font-size:16px; letter-spacing:0.06em">ENDEAVOUR MINING — GROUP IT</div>
      <div style="font-size:13px; color:var(--color-neutral-600)">IT Business Reviews · Infrastructure Inspection Assurance</div>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap">
      <div style="display:flex; border:2px solid var(--color-text)">
        <sc-for list="{{ viewOpts }}" as="v">
          <a href="?view={{ v.key }}" data-q="view" data-v="{{ v.key }}" style="border:none; cursor:pointer; padding:8px 16px; font-family:var(--font-heading); font-weight:600; font-size:13px; letter-spacing:0.04em; background:{{ v.bg }}; color:{{ v.fg }}; text-decoration:none; display:inline-block" style-hover="opacity:0.85">{{ v.label }}</a>
        </sc-for>
      </div>
      <div style="display:flex; border:2px solid var(--color-text)">
        <sc-for list="{{ periodOpts }}" as="p">
          <a href="?period={{ p.key }}" data-q="period" data-v="{{ p.key }}" style="border:none; cursor:pointer; padding:8px 14px; font-family:var(--font-heading); font-weight:600; font-size:13px; letter-spacing:0.04em; background:{{ p.bg }}; color:{{ p.fg }}; text-decoration:none; display:inline-block" style-hover="opacity:0.85">{{ p.label }}</a>
        </sc-for>
      </div>
      <div style="display:flex; border:2px solid var(--color-text)">
        <sc-for list="{{ siteOpts }}" as="s">
          <a href="?site={{ s.key }}" data-q="site" data-v="{{ s.key }}" style="border:none; cursor:pointer; padding:8px 12px; font-family:var(--font-heading); font-weight:600; font-size:13px; background:{{ s.bg }}; color:{{ s.fg }}; text-decoration:none; display:inline-block" style-hover="opacity:0.85">{{ s.label }}</a>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- ============ DASHBOARD VIEW ============ -->
  <sc-if value="{{ isDashboard }}">
  <div>

    <!-- context strip -->
    <div style="display:flex; gap:24px; padding:10px 32px; border-bottom:2px solid var(--color-divider); font-size:13px; color:var(--color-neutral-700); flex-wrap:wrap">
      <div><span style="font-weight:700; color:var(--color-text)">{{ scopeLabel }}</span> · week ending {{ anchorLabel }}</div>
      <div>Comparing <span style="font-weight:700; color:var(--color-text)">{{ curWinLabel }}</span> vs {{ prevWinLabel }}</div>
      <div style="flex:1"></div>
      <div>Data through {{ dataThrough }} · {{ nIssues }} issues · {{ nMeetings }} reviews · {{ nInspections }} inspections</div>
    </div>
    <div style="padding:0 32px 10px; border-bottom:2px solid var(--color-divider)">
      <div class="disclosure">Scores are measured from the programme start (01 Apr) to the as-of date; the emailed site reports score the same model over a <strong>rolling 3-month window</strong>, so the two can differ. <code>?asOf=</code> moves the score only &mdash; the period windows above are pinned to the anchor date.</div>
    </div>

    <!-- 1. KPI BAND -->
    <div style="display:grid; grid-template-columns:repeat(8,1fr); gap:2px; background:var(--color-divider); border-bottom:2px solid var(--color-divider)">
      <sc-for list="{{ kpis }}" as="k">
        <div style="background:var(--color-bg); padding:16px 16px 14px">
          <div style="font-size:11px; font-weight:700; letter-spacing:0.08em; color:var(--color-neutral-600); text-transform:uppercase">{{ k.label }}</div>
          <div style="display:flex; align-items:baseline; gap:8px; margin-top:6px">
            <div style="font-family:var(--font-heading); font-weight:700; font-size:32px; line-height:1">{{ k.value }}</div>
            <div style="font-size:12px; color:var(--color-neutral-600)">{{ k.unit }}</div>
          </div>
          <div style="display:flex; align-items:center; gap:6px; margin-top:8px; min-height:24px">
            <svg width="64" height="22" viewBox="0 0 64 22" style="flex:none"><polyline points="{{ k.spark }}" fill="none" stroke="var(--color-neutral-400)" stroke-width="1.5"></polyline><circle cx="{{ k.sparkX }}" cy="{{ k.sparkY }}" r="2.5" fill="var(--color-accent)"></circle></svg>
            <div style="font-size:12px; font-weight:700; color:{{ k.deltaColor }}">{{ k.deltaTxt }}</div>
          </div>
          <div style="font-size:11px; color:var(--color-neutral-500); margin-top:2px">{{ k.deltaNote }}</div>
        </div>
      </sc-for>
    </div>

    <!-- 2. SITE HEALTH LEADERBOARD -->
    <div style="padding:28px 32px; border-bottom:2px solid var(--color-divider)">
      <div style="display:flex; align-items:baseline; gap:16px">
        <h2 style="font-family:var(--font-heading); font-weight:700; font-size:22px; margin:0">Site Health Leaderboard</h2>
        <div style="font-size:13px; color:var(--color-neutral-600)">Composite v2 — Delivery 40 · Governance 35 · Engagement 25 · penalties (−3/escalation &gt;60 d, −5 any HIGH &gt;90 d)</div>
      </div>
      <table class="table" style="width:100%; margin-top:16px; border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left; padding:8px 12px 8px 0; width:36px">#</th>
          <th style="text-align:left; padding:8px 12px">Site</th>
          <th style="text-align:left; padding:8px 12px; width:26%">Delivery / Governance / Engagement</th>
          <th style="text-align:right; padding:8px 12px">Score</th>
          <th style="text-align:right; padding:8px 12px">Δ {{ periodShort }}</th>
          <th style="text-align:right; padding:8px 12px">Open</th>
          <th style="text-align:right; padding:8px 12px">Overdue</th>
          <th style="text-align:right; padding:8px 12px">HIGH</th>
          <th style="text-align:right; padding:8px 12px">Penalty</th>
          <th style="text-align:left; padding:8px 0 8px 16px">Status</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{ leaderboard }}" as="r">
            <tr style="border-top:1px solid var(--color-neutral-300); background:{{ r.rowBg }}; cursor:pointer" data-q="site" data-v="{{ r.code }}">
              <td style="padding:10px 12px 10px 0; font-weight:700; color:var(--color-neutral-500)">{{ r.rank }}</td>
              <td style="padding:10px 12px"><span style="font-family:var(--font-heading); font-weight:700">{{ r.name }}</span> <span style="color:var(--color-neutral-500); font-size:12px">{{ r.code }} · {{ r.country }}</span></td>
              <td style="padding:10px 12px">
                <div style="display:flex; height:14px; width:100%; background:var(--color-neutral-200)">
                  <div style="width:{{ r.wDel }}%; background:var(--color-text)" title="Delivery"></div>
                  <div style="width:{{ r.wGov }}%; background:var(--color-neutral-500)" title="Governance"></div>
                  <div style="width:{{ r.wEng }}%; background:var(--color-accent)" title="Engagement"></div>
                </div>
                <div style="font-size:11px; color:var(--color-neutral-600); margin-top:3px">D {{ r.del }} · G {{ r.gov }} · E {{ r.eng }}</div>
              </td>
              <td style="padding:10px 12px; text-align:right; font-family:var(--font-heading); font-weight:700; font-size:20px">{{ r.score }}</td>
              <td style="padding:10px 12px; text-align:right; font-weight:700; color:{{ r.deltaColor }}">{{ r.delta }}</td>
              <td style="padding:10px 12px; text-align:right">{{ r.open }}</td>
              <td style="padding:10px 12px; text-align:right; color:{{ r.overdueColor }}; font-weight:{{ r.overdueWeight }}">{{ r.overdue }}</td>
              <td style="padding:10px 12px; text-align:right; color:{{ r.highColor }}; font-weight:{{ r.highWeight }}">{{ r.high }}</td>
              <td style="padding:10px 12px; text-align:right; color:var(--color-accent-700)">{{ r.penalty }}</td>
              <td style="padding:10px 0 10px 16px"><span style="display:inline-block; padding:2px 10px; font-size:11px; font-weight:700; letter-spacing:0.05em; background:{{ r.ragBg }}; color:{{ r.ragFg }}">{{ r.rag }}</span></td>
            </tr>
          </sc-for>
          <sc-for list="{{ groupRows }}" as="g">
            <tr style="border-top:2px solid var(--color-divider); background:var(--color-neutral-100)">
              <td style="padding:8px 12px 8px 0"></td>
              <td style="padding:8px 12px; font-weight:700; font-size:13px; letter-spacing:0.04em">{{ g.name }}</td>
              <td style="padding:8px 12px; font-size:12px; color:var(--color-neutral-600)">{{ g.sites }}</td>
              <td style="padding:8px 12px; text-align:right; font-family:var(--font-heading); font-weight:700; font-size:16px">{{ g.score }}</td>
              <td style="padding:8px 12px; text-align:right; font-weight:700; color:{{ g.deltaColor }}">{{ g.delta }}</td>
              <td style="padding:8px 12px; text-align:right">{{ g.open }}</td>
              <td style="padding:8px 12px; text-align:right">{{ g.overdue }}</td>
              <td style="padding:8px 12px; text-align:right">{{ g.high }}</td>
              <td style="padding:8px 12px"></td><td style="padding:8px 0 8px 16px"></td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>

    <!-- 3. FLOW + BACKLOG -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; background:var(--color-divider); border-bottom:2px solid var(--color-divider)">
      <div style="background:var(--color-bg); padding:28px 32px">
        <h3 style="font-family:var(--font-heading); font-weight:700; font-size:16px; margin:0">Raised vs closed by month</h3>
        <div style="font-size:12px; color:var(--color-neutral-600); margin-top:2px">raised = meeting_date · closed = closed_at · closure ratio ≥ 1.0 means burning down</div>
        <div style="display:flex; gap:20px; align-items:flex-end; margin-top:20px; height:150px">
          <sc-for list="{{ flowMonths }}" as="m">
            <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-end; height:100%">
              <div style="display:flex; gap:4px; align-items:flex-end; height:120px">
                <div style="flex:1; height:{{ m.hRaised }}%; background:var(--color-text)" title="raised"></div>
                <div style="flex:1; height:{{ m.hClosed }}%; background:var(--color-accent)" title="closed"></div>
              </div>
              <div style="font-size:12px; font-weight:700; margin-top:6px">{{ m.label }}</div>
              <div style="font-size:11px; color:var(--color-neutral-600)">{{ m.raised }} ↑ · {{ m.closed }} ✓ · ratio <span style="font-weight:700; color:{{ m.ratioColor }}">{{ m.ratio }}</span></div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex; gap:16px; margin-top:14px; font-size:12px">
          <div style="display:flex; align-items:center; gap:6px"><div style="width:10px; height:10px; background:var(--color-text)"></div>Raised</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:10px; height:10px; background:var(--color-accent)"></div>Closed</div>
        </div>
      </div>
      <div style="background:var(--color-bg); padding:28px 32px">
        <h3 style="font-family:var(--font-heading); font-weight:700; font-size:16px; margin:0">Open backlog over time</h3>
        <div style="font-size:12px; color:var(--color-neutral-600); margin-top:2px">reconstructed weekly from raise/close dates — {{ backlogNow }} open now</div>
        <svg width="100%" height="150" viewBox="0 0 600 150" preserveAspectRatio="none" style="margin-top:20px; display:block">
          <line x1="0" y1="149" x2="600" y2="149" stroke="var(--color-neutral-400)" stroke-width="1"></line>
          <polyline points="{{ backlogPts }}" fill="none" stroke="var(--color-text)" stroke-width="2.5"></polyline>
          <circle cx="{{ backlogEndX }}" cy="{{ backlogEndY }}" r="4" fill="var(--color-accent)"></circle>
        </svg>
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--color-neutral-600); margin-top:4px"><div>{{ backlogStartLabel }}</div><div>{{ anchorLabel }}</div></div>
        <div style="font-size:12px; margin-top:10px; color:var(--color-neutral-700)">Peak {{ backlogPeak }} · now {{ backlogNow }} <span style="font-weight:700; color:{{ backlogTrendColor }}">{{ backlogTrendTxt }}</span></div>
      </div>
    </div>

    <!-- 4. 5E GOVERNANCE MATRIX -->
    <div style="padding:28px 32px; border-bottom:2px solid var(--color-divider)">
      <div style="display:flex; align-items:baseline; gap:16px">
        <h2 style="font-family:var(--font-heading); font-weight:700; font-size:22px; margin:0">5 Engagements — governance matrix</h2>
        <div style="font-size:13px; color:var(--color-neutral-600)">E1 cadence · E2 diffusion ≤48 h · E3 champion coverage · E4 not yet measured · E5 discipline</div>
      </div>
      <table style="width:100%; margin-top:16px; border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left; padding:8px 12px 8px 0; font-size:12px; letter-spacing:0.05em">SITE</th>
          <sc-for list="{{ eHeaders }}" as="h">
            <th style="text-align:center; padding:8px 12px; font-size:12px; letter-spacing:0.05em">{{ h.label }}<div style="font-weight:400; font-size:10px; color:var(--color-neutral-500)">{{ h.sub }}</div></th>
          </sc-for>
        </tr></thead>
        <tbody>
          <sc-for list="{{ eMatrix }}" as="row">
            <tr style="border-top:1px solid var(--color-neutral-300)">
              <td style="padding:0 12px 0 0; font-weight:700; font-family:var(--font-heading)">{{ row.site }}</td>
              <sc-for list="{{ row.cells }}" as="c">
                <td style="padding:2px; text-align:center">
                  <div style="padding:12px 4px; background:{{ c.bg }}; color:{{ c.fg }}; font-weight:700; font-size:15px" title="{{ c.tip }}">{{ c.val }}</div>
                </td>
              </sc-for>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <div style="font-size:12px; color:var(--color-neutral-600); margin-top:10px">Grey = not measured (never silently green). Fleet E2 diffusion is the weakest engagement — signature latency locates the break in the funnel below.</div>
      <div style="display:flex; gap:2px; margin-top:16px; background:var(--color-divider); border:2px solid var(--color-divider)">
        <sc-for list="{{ sigFunnel }}" as="f">
          <div style="flex:1; background:var(--color-bg); padding:14px 16px">
            <div style="font-size:11px; font-weight:700; letter-spacing:0.06em; color:var(--color-neutral-600); text-transform:uppercase">{{ f.label }}</div>
            <div style="font-family:var(--font-heading); font-weight:700; font-size:24px; margin-top:4px">{{ f.value }}</div>
            <div style="font-size:12px; color:{{ f.noteColor }}; margin-top:2px">{{ f.note }}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- 5. DELIVERY & BACKLOG -->
    <div style="display:grid; grid-template-columns:5fr 4fr; gap:2px; background:var(--color-divider); border-bottom:2px solid var(--color-divider)">
      <div style="background:var(--color-bg); padding:28px 32px">
        <h3 style="font-family:var(--font-heading); font-weight:700; font-size:16px; margin:0">Backlog aging × severity {{ scopeSuffix }}</h3>
        <div style="font-size:12px; color:var(--color-neutral-600); margin-top:2px">age = today − raise date · &gt;90 d + HIGH = escalation candidates</div>
        <div style="margin-top:18px; display:flex; flex-direction:column; gap:10px">
          <sc-for list="{{ aging }}" as="b">
            <div style="display:grid; grid-template-columns:70px 1fr 110px; align-items:center; gap:12px">
              <div style="font-size:13px; font-weight:700">{{ b.label }}</div>
              <div style="display:flex; height:22px; background:var(--color-neutral-200)">
                <div style="width:{{ b.wHigh }}%; background:var(--color-accent)" title="HIGH"></div>
                <div style="width:{{ b.wMed }}%; background:var(--color-neutral-600)" title="MEDIUM"></div>
                <div style="width:{{ b.wLow }}%; background:var(--color-neutral-400)" title="LOW"></div>
              </div>
              <div style="font-size:12px; color:var(--color-neutral-700)">{{ b.total }} <span style="color:var(--color-accent-700); font-weight:700">{{ b.highTxt }}</span></div>
            </div>
          </sc-for>
        </div>
        <div style="display:flex; gap:16px; margin-top:12px; font-size:12px">
          <div style="display:flex; align-items:center; gap:6px"><div style="width:10px; height:10px; background:var(--color-accent)"></div>HIGH</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:10px; height:10px; background:var(--color-neutral-600)"></div>MEDIUM</div>
          <div style="display:flex; align-items:center; gap:6px"><div style="width:10px; height:10px; background:var(--color-neutral-400)"></div>LOW</div>
        </div>
        <h3 style="font-family:var(--font-heading); font-weight:700; font-size:16px; margin:28px 0 0">Champion load <span style="font-weight:400; font-size:12px; color:var(--color-neutral-600)">open items per champion · alert ≥ 7</span></h3>
        <div style="margin-top:14px; display:flex; flex-direction:column; gap:8px">
          <sc-for list="{{ champLoad }}" as="c">
            <div style="display:grid; grid-template-columns:180px 1fr 60px; align-items:center; gap:12px">
              <div style="font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis" title="{{ c.name }}">{{ c.name }}</div>
              <div style="height:16px; background:var(--color-neutral-200)"><div style="width:{{ c.w }}%; height:100%; background:{{ c.color }}"></div></div>
              <div style="font-size:13px; font-weight:700; color:{{ c.numColor }}">{{ c.n }}{{ c.flag }}</div>
            </div>
          </sc-for>
        </div>
      </div>
      <div style="background:var(--color-bg); padding:28px 32px">
        <h3 style="font-family:var(--font-heading); font-weight:700; font-size:16px; margin:0">Overdue register {{ scopeSuffix }}</h3>
        <div style="font-size:12px; color:var(--color-neutral-600); margin-top:2px">{{ overdueCount }} open past target date — worst first · K03</div>
        <div style="margin-top:14px; display:flex; flex-direction:column">
          <sc-for list="{{ overdueRows }}" as="o">
            <div style="display:grid; grid-template-columns:52px 1fr 90px; gap:10px; padding:9px 0; border-top:1px solid var(--color-neutral-300); align-items:baseline">
              <div style="font-family:var(--font-heading); font-weight:700; font-size:16px; color:{{ o.dColor }}">{{ o.days }}<span style="font-size:10px; font-weight:400"> d</span></div>
              <div>
                <div style="font-size:13px; font-weight:600; line-height:1.3">{{ o.title }}</div>
                <div style="font-size:11px; color:var(--color-neutral-600); margin-top:2px">{{ o.meta }}</div>
              </div>
              <div style="text-align:right"><span style="display:inline-block; padding:1px 8px; font-size:10px; font-weight:700; background:{{ o.sevBg }}; color:{{ o.sevFg }}">{{ o.sev }}</span></div>
            </div>
          </sc-for>
        </div>
        <div style="font-size:12px; color:var(--color-neutral-600); margin-top:10px">{{ noTargetNote }}</div>
      </div>
    </div>

    <!-- 6. INSPECTIONS -->
    <div style="padding:28px 32px; border-bottom:2px solid var(--color-divider)">
      <div style="display:flex; align-items:baseline; gap:16px">
        <h2 style="font-family:var(--font-heading); font-weight:700; font-size:22px; margin:0">Infrastructure Inspection Assurance</h2>
        <div style="font-size:13px; color:var(--color-neutral-600)">{{ nInspections }} inspections · {{ nFindings }} checklist items assessed · {{ defectCount }} defects found</div>
      </div>
      <div style="display:grid; grid-template-columns:3fr 2fr; gap:2px; background:var(--color-divider); border:2px solid var(--color-divider); margin-top:16px">
        <div style="background:var(--color-bg); padding:20px 24px">
          <table style="width:100%; border-collapse:collapse">
            <thead><tr>
              <th style="text-align:left; padding:6px 8px 6px 0; font-size:11px; letter-spacing:0.05em">SITE</th>
              <th style="text-align:right; padding:6px 8px; font-size:11px">INSP.</th>
              <th style="text-align:right; padding:6px 8px; font-size:11px">LAST</th>
              <th style="text-align:right; padding:6px 8px; font-size:11px">DAYS AGO</th>
              <th style="text-align:left; padding:6px 8px; font-size:11px; width:30%">DEFECTS (CRIT / MAJ / MIN)</th>
              <th style="text-align:right; padding:6px 8px; font-size:11px">CONFORMITY</th>
              <th style="text-align:right; padding:6px 0 6px 8px; font-size:11px">ACTIONS OPEN</th>
            </tr></thead>
            <tbody>
              <sc-for list="{{ inspSiteRows }}" as="i">
                <tr style="border-top:1px solid var(--color-neutral-300)">
                  <td style="padding:9px 8px 9px 0; font-weight:700; font-family:var(--font-heading)">{{ i.site }}</td>
                  <td style="padding:9px 8px; text-align:right">{{ i.count }}</td>
                  <td style="padding:9px 8px; text-align:right; font-size:12px">{{ i.last }}</td>
                  <td style="padding:9px 8px; text-align:right; font-weight:700; color:{{ i.daysColor }}">{{ i.daysAgo }}</td>
                  <td style="padding:9px 8px">
                    <div style="display:flex; height:14px; background:var(--color-neutral-200)">
                      <div style="width:{{ i.wCrit }}%; background:var(--color-accent)"></div>
                      <div style="width:{{ i.wMaj }}%; background:var(--color-neutral-700)"></div>
                      <div style="width:{{ i.wMin }}%; background:var(--color-neutral-400)"></div>
                    </div>
                    <div style="font-size:11px; color:var(--color-neutral-600); margin-top:2px">{{ i.defTxt }}</div>
                  </td>
                  <td style="padding:9px 8px; text-align:right; font-weight:700; color:{{ i.confColor }}">{{ i.conf }}</td>
                  <td style="padding:9px 0 9px 8px; text-align:right">{{ i.actOpen }}</td>
                </tr>
              </sc-for>
            </tbody>
          </table>
          <div style="font-size:12px; color:var(--color-neutral-600); margin-top:10px">Conformity = ok ÷ applicable items. Sites &gt;45 days since last inspection are flagged.</div>
        </div>
        <div style="background:var(--color-bg); padding:20px 24px">
          <div style="font-size:12px; font-weight:700; letter-spacing:0.06em; color:var(--color-neutral-600); text-transform:uppercase">Defects by domain {{ scopeSuffix }}</div>
          <div style="margin-top:12px; display:flex; flex-direction:column; gap:7px">
            <sc-for list="{{ findCats }}" as="fc">
              <div style="display:grid; grid-template-columns:110px 1fr 40px; align-items:center; gap:10px">
                <div style="font-size:12px">{{ fc.label }}</div>
                <div style="height:13px; background:var(--color-neutral-200)"><div style="width:{{ fc.w }}%; height:100%; background:{{ fc.color }}"></div></div>
                <div style="font-size:12px; font-weight:700; text-align:right">{{ fc.n }}</div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>

    <!-- 6b. HELPDESK & CHANGES — OURS, additive. NOT the authoritative
         dashboard's: his D has no helpdesk concept at all. It rides in via
         buildReviewVals' optional `extras` arg and it never enters the score.
         The WHOLE panel — heading included — is gated on hdRows: without the
         gate the degrade path (extras undefined) would still render this
         heading and an empty table with its header row, because a loop over a
         missing list emits nothing but nothing removes static markup. An empty
         [] is truthy, so this hides the panel ONLY on the degrade path.
         NB: never write a literal control tag in a comment — the renderer's tag
         scan reads RAW text and does not skip comments, so the mention itself
         would be parsed as a tag and corrupt the page. -->
    <sc-if value="{{ hdRows }}">
    <div style="padding:28px 32px; border-bottom:2px solid var(--color-divider)">
      <div style="display:flex; align-items:baseline; gap:16px">
        <h2 style="font-family:var(--font-heading); font-weight:700; font-size:22px; margin:0">Helpdesk &amp; Changes</h2>
        <div style="font-size:13px; color:var(--color-neutral-600)">{{ hdNote }}</div>
      </div>
      <table class="table" style="width:100%; margin-top:16px; border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left; padding:8px 12px 8px 0">Site</th>
          <th style="text-align:right; padding:8px 12px">Created</th>
          <th style="text-align:right; padding:8px 12px">Resolved</th>
          <th style="text-align:right; padding:8px 12px">Backlog</th>
          <th style="text-align:right; padding:8px 12px">SLA overdue</th>
          <th style="text-align:right; padding:8px 12px">Major incidents</th>
          <th style="text-align:right; padding:8px 12px">Changes</th>
          <th style="text-align:right; padding:8px 12px">Failed</th>
          <th style="text-align:right; padding:8px 12px">Emergency</th>
          <th style="text-align:right; padding:8px 0 8px 12px">Success</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{ hdRows }}" as="h">
            <tr style="border-top:1px solid var(--color-neutral-300)">
              <td style="padding:10px 12px 10px 0"><span style="font-family:var(--font-heading); font-weight:700">{{ h.name }}</span> <span style="color:var(--color-neutral-500); font-size:12px">{{ h.code }}</span></td>
              <td style="padding:10px 12px; text-align:right">{{ h.created }}</td>
              <td style="padding:10px 12px; text-align:right">{{ h.resolved }}</td>
              <td style="padding:10px 12px; text-align:right">{{ h.backlog }}</td>
              <td style="padding:10px 12px; text-align:right; font-weight:700; color:{{ h.slaColor }}">{{ h.slaOverdue }}</td>
              <td style="padding:10px 12px; text-align:right; font-weight:700; color:{{ h.miColor }}">{{ h.majorIncidents }}</td>
              <td style="padding:10px 12px; text-align:right">{{ h.changes }}</td>
              <td style="padding:10px 12px; text-align:right">{{ h.failed }}</td>
              <td style="padding:10px 12px; text-align:right">{{ h.emergency }}</td>
              <td style="padding:10px 0 10px 12px; text-align:right; font-weight:700; color:{{ h.successColor }}">{{ h.successPct }}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <div style="font-size:12px; color:var(--color-neutral-600); margin-top:10px">Failed includes backed-out changes. Success = successful ÷ executed; the raw counts sit beside it because some sites have very few executed changes.</div>
    </div>
    </sc-if>

    <!-- 6c. SCOREBOARD OPÉRATIONNEL — OURS, additive. A 4-dimension weighted
         composite (helpdesk · inspections · réunions · actifs), DISTINCT from
         his "Score programme" (sbDims) above. Rides in via buildReviewVals'
         optional `extras` arg and never enters his score. Gated WHOLLY on
         sbuRows so the degrade path (no extras) renders nothing at all.
         NB: never write a literal control tag in a comment — the renderer's tag
         scan reads RAW text and does not skip comments. -->
    <sc-if value="{{ sbuRows }}" hint-placeholder-val="{{ true }}">
    <div style="padding:28px 32px; border-bottom:2px solid var(--color-divider)">
      <div style="display:flex; align-items:baseline; gap:16px; flex-wrap:wrap">
        <h2 style="font-family:var(--font-heading); font-weight:700; font-size:22px; margin:0">Scoreboard opérationnel — 4 dimensions (helpdesk · inspections · réunions · actifs)</h2>
        <div style="font-size:13px; color:var(--color-neutral-600)">Moyenne flotte <strong>{{ sbuNote.fleet_avg }}</strong> · Meilleure progression <strong>{{ sbuNote.most_improved }}</strong> · À surveiller <strong>{{ sbuNote.needs_attention }}</strong></div>
      </div>
      <table class="table" style="width:100%; margin-top:16px; border-collapse:collapse">
        <thead><tr>
          <th style="text-align:left; padding:8px 10px 8px 0; width:34px">#</th>
          <th style="text-align:left; padding:8px 10px">Site</th>
          <th style="text-align:right; padding:8px 10px">Global</th>
          <th style="text-align:center; padding:8px 10px">Helpdesk</th>
          <th style="text-align:center; padding:8px 10px">Inspections</th>
          <th style="text-align:center; padding:8px 10px">Réunions</th>
          <th style="text-align:center; padding:8px 10px">Actifs</th>
          <th style="text-align:right; padding:8px 0 8px 10px">Δ</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{ sbuRows }}" as="r" hint-placeholder-count="6">
            <tr style="border-top:1px solid var(--color-neutral-300)">
              <td style="padding:8px 10px 8px 0; font-weight:700; color:var(--color-neutral-500)">{{ r.rank }}</td>
              <td style="padding:8px 10px"><span style="font-family:var(--font-heading); font-weight:700">{{ r.name }}</span> <span style="color:var(--color-neutral-500); font-size:12px">{{ r.code }}</span></td>
              <td style="padding:6px 10px; text-align:right"><span style="display:inline-block; min-width:32px; padding:4px 12px; font-family:var(--font-heading); font-weight:700; font-size:16px; background:{{ r.scoreBg }}; color:{{ r.scoreFg }}">{{ r.score }}</span></td>
              <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="4">
                <td style="padding:6px 4px; text-align:center"><div style="padding:8px 4px; font-weight:700; font-size:14px; background:{{ c.bg }}; color:{{ c.fg }}">{{ c.val }}</div></td>
              </sc-for>
              <td style="padding:8px 0 8px 10px; text-align:right; font-weight:700; color:{{ r.deltaColor }}">{{ r.delta }}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
      <div style="font-size:12px; color:var(--color-neutral-600); margin-top:10px">{{ sbuNote.text }}</div>
    </div>
    </sc-if>

    <!-- 7. PROJECTS + DATA QUALITY -->
