<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboards — Endeavour Mining IT</title>
<link rel="stylesheet" href="_tokens.css">
<link rel="stylesheet" href="brand/icons.css">
<link rel="stylesheet" href="brand/components.css">
<link rel="stylesheet" href="_shell.css">
<script src="vendor/chart.js/4.4.1/chart.umd.js" defer></script>
<script src="lib/chartTheme.js" defer></script>
<script nonce="%%CSP_NONCE%%" src="brand/icons.js"></script>
<script nonce="%%CSP_NONCE%%" src="auth.js" data-require="any" data-redirect="login.html"></script>
<script nonce="%%CSP_NONCE%%" src="_shell.js"></script>
<script nonce="%%CSP_NONCE%%" src="lib/dashboardRender.js"></script>
<script src="lib/pageHead.js"></script>
<style nonce="%%CSP_NONCE%%">
  body { margin:0; background:var(--color-background,#f4f6f7); color:var(--color-text-primary,#1F2A33); font-family:var(--font-sans,'Libre Franklin',system-ui,sans-serif); font-size:14px; }
  .wrap { max-width:1360px; margin:0 auto; padding:var(--space-6,24px); }
  .head { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .head h1 { margin:0; font-size:22px; font-weight:700; color:var(--edv-slate,#3A4A60); }
  .head .sub { font-size:13px; color:var(--color-text-muted,#6b7785); }
  .controls { margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select, input[type=month], input[type=week], .btn { padding:7px 12px; border:1px solid #cfd6e0; border-radius:8px; background:#fff; font-size:13px; color:#1F2A33; }
  .btn { cursor:pointer; } .btn.primary { background:var(--edv-slate,#3A4A60); color:#fff; border-color:var(--edv-slate,#3A4A60); }
  label.ctl { font-size:12px; color:#6b7785; display:flex; flex-direction:column; gap:3px; }
  .list { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .card { background:#fff; border:1px solid #e4e8ee; border-radius:12px; padding:14px 16px; display:block; color:inherit; text-decoration:none; }
  .card:hover, .card:focus { border-color:#3A4A60;}
  .card h3 { margin:0 0 6px; font-size:15px; color:#3A4A60; } .card .meta { font-size:12px; color:#6b7785; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .section-title { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#6b7785; margin:18px 0 8px; font-weight:700; }
  .status { font-size:12.5px; color:#6b7785; margin:8px 0; }
  canvas { max-height:220px; }
  .sr-only { position:absolute; left:-9999px; }
</style>
</head>
<body>
<a class="edv-skip" href="#main">Skip to content</a>
<div id="__shell" data-section="operations" data-current="dashboards"></div>
<main id="main" class="wrap">
  <div class="head">
    <div><h1 id="title">Dashboards</h1><div class="sub" id="subtitle">Published dashboards — every figure comes from the KPI dictionary and is dated.</div></div>
    <div class="controls" id="controls" hidden>
      <label class="ctl">Site <select id="site" aria-label="Site"></select></label>
      <label class="ctl" id="winWrap">Period <input id="window" type="text" list="windowList" aria-label="Period (YYYY-MM or YYYY-Www)" placeholder="latest" size="10"><datalist id="windowList"></datalist></label>
      <button class="btn" id="apply" type="button">Apply</button>
      <button class="btn" id="edit" type="button" hidden>Edit in composer</button>
      <a class="btn" id="csv" href="#" download>Download figures (CSV)</a>
      <a class="btn" id="back" href="dashboards.html">All dashboards</a>
      <!-- C-28 — the Executive Scorecard leaves the menu when ui_exec_nav='consolidated'; Executive Home links to it -->
      <a class="btn shell-exec-consolidated-only" id="scorecardLink" href="executive.html">Executive Scorecard</a>
    </div>
  </div>
  <div id="pageHead"></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="edv-dash-empty" id="staleBanner" role="alert" hidden></div>
  <section id="listSection"></section>
  <section id="dash" class="edv-dash" data-density="comfortable" aria-label="Dashboard widgets"></section>
</main>
<script nonce="%%CSP_NONCE%%">
(function () {
  'use strict';
  var R = window.DashboardRender;
  var $ = function (id) { return document.getElementById(id); };
  var H = function () { return {}; };
  var params = new URLSearchParams(location.search);
  var key = params.get('key');
  var charts = [], bodies = {};

  function api(path, opts) { return fetch(path, Object.assign({ headers: H() }, opts || {})).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); }); }
  function status(msg) { $('status').textContent = msg || ''; }

  // ── list mode ──────────────────────────────────────────────────────────────────────
  function renderList() {
    api('/api/dashboards').then(function (j) {
      var byAud = {};
      j.dashboards.forEach(function (d) { (byAud[d.audience] = byAud[d.audience] || []).push(d); });
      var html = '';
      ['executive', 'site', 'committee', 'field'].forEach(function (a) {
        if (!byAud[a]) return;
        html += '<div class="section-title">' + a + '</div><div class="list">' + byAud[a].map(function (d) {
          return '<a class="card" href="dashboards.html?key=' + encodeURIComponent(d.key) + '"><h3>' + R.escapeHtml(d.title) + '</h3><div class="meta">' +
            '<span class="edv-chip edv-chip--' + (d.status === 'published' ? 'pub' : d.status === 'draft' ? 'draft' : 'retired') + '">' + d.status + (d.version ? ' v' + d.version : '') + '</span>' +
            '<span>' + d.widgets + ' widgets</span>' + (d.site_id != null ? '<span>site-specific</span>' : '<span>fleet</span>') + '</div></a>';
        }).join('') + '</div>';
      });
      if (j.publisher) html += '<div class="section-title">Composer</div><p><a class="btn primary" href="dashboard-composer.html">New dashboard</a></p>';
      $('listSection').innerHTML = html || '<div class="edv-dash-empty">No published dashboard is visible to your account yet.</div>';
      if (window.PageHead) window.PageHead.mount($('pageHead'), { question: 'Which published dashboards can I open?', scope: 'Dashboards visible to your account', sources: false });
      status('');
    }).catch(function (e) { status('Could not load dashboards: ' + e.message); });
  }

  // ── view mode ──────────────────────────────────────────────────────────────────────
  var def = null, meta = null;
  function renderView() {
    $('controls').hidden = false;
    var has = window.__userHasRole || function () { return false; };
    if (key !== 'exec-home' || !(has('executive') || has('scorecard-viewer'))) { var sl = $('scorecardLink'); if (sl) sl.remove(); }
    api('/api/dashboards/' + encodeURIComponent(key)).then(function (j) {
      meta = j.dashboard; def = j.published || j.dashboard.definition;
      $('title').textContent = meta.title;
      $('subtitle').textContent = (meta.audience + ' dashboard' + (meta.version ? ' · version ' + meta.version : ' · draft, not published')) + ' — figures from the KPI dictionary (help §20).';
      $('edit').hidden = !j.publisher;
      $('edit').addEventListener('click', function () { location.href = 'dashboard-composer.html?key=' + encodeURIComponent(key); });
      document.title = meta.title + ' — Endeavour Mining IT';
      fetch('/api/dashboards/' + encodeURIComponent(key) + '/view', { method: 'POST', headers: H() }).catch(function () {});
      loadData();
    }).catch(function (e) { status('Dashboard unavailable: ' + e.message); });
  }

  // Annex B #6 — a late response from an earlier filter must never overwrite a newer one
  var loadSeq = 0;
  function loadData() {
    var seq = ++loadSeq;
    status('Loading…');
    var q = [];
    if ($('site').value) q.push('site=' + encodeURIComponent($('site').value));
    if ($('window').value.trim()) q.push('window=' + encodeURIComponent($('window').value.trim()));
    if (meta && meta.status !== 'published') q.push('draft=1');
    $('csv').href = '/api/dashboards/' + encodeURIComponent(key) + '/data.csv' + (q.length ? '?' + q.join('&') : '');   // same filters as the screen
    api('/api/dashboards/' + encodeURIComponent(key) + '/data' + (q.length ? '?' + q.join('&') : '')).then(function (d) {
      if (seq !== loadSeq) return;
      var sel = $('site');
      // design review B3: the single figures are ONE site's (the server never mixes sites into a tile);
      // the per-site charts list every site in scope — say so instead of implying a fleet total
      if (!sel.options.length) d.sites.forEach(function (s) { var o = document.createElement('option'); o.value = s.id; o.textContent = s.name; sel.appendChild(o); });
      if (d.site != null) sel.value = String(d.site);
      var nm = (d.sites || []).filter(function (s) { return Number(s.id) === Number(d.site); })[0];
      d.scope_note = nm ? 'Single figures: ' + nm.name + ' · per-site charts: your ' + d.sites.length + ' sites' : '';
      renderWidgets(def, d);
      var st = (d.stale_sources || []).map(function (x) { return x.module + (x.state === 'UNKNOWN' ? ' (never synced)' : ' (last sync ' + x.age_h + ' h ago, limit ' + x.limit_h + ' h)'); });
      // F21 — the response time is "Computed at"; how recent the DATA is comes per source ("Data through")
      // C-10 — the shared page head carries scope / window / "Data through" per source / "Computed at",
      // straight from this response (C-05 sources[] + computed_at): never a date the server did not give.
      if (window.PageHead) window.PageHead.mount($('pageHead'), {
        question: 'What do the published figures of "' + (meta ? meta.title : key) + '" say for this site and period?',
        scope: d.scope_note || (nm ? nm.name : (d.note || '')),
        window: d.window ? d.window : 'Latest complete period',
        sources: d.sources || [], computedAt: d.computed_at || d.as_of || null });
      status(d.note || '');
      // design review #4: a stale source is a banner above the figures, not the tail of a grey sentence
      var bn = $('staleBanner'); bn.hidden = !st.length; bn.textContent = st.length ? 'Some figures are not current — their colour is withheld: ' + st.join(', ') + '.' : '';
    }).catch(function (e) { if (seq !== loadSeq) return; status('Data unavailable: ' + e.message); });
  }

  function renderWidgets(def, data) {
    charts.forEach(function (c) { try { c.destroy(); } catch (_) {} }); charts = [];
    bodies = {};
    var root = $('dash'); root.innerHTML = '';
    var cols = (def.grid && def.grid.columns) || 12;
    root.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0,1fr))';
    (def.widgets || []).forEach(function (w) {
      var d = data.widgets[w.id] || {};
      var el = document.createElement('section');
      el.className = 'edv-widget ' + (d.mode === 'single' ? R.ragClass(d.rag) + (d.value == null ? ' edv-quiet' : '') : '') + (d.freshness && d.freshness !== 'FRESH' ? ' edv-stale' : '');
      el.setAttribute('style', R.gridStyle(w.layout, cols));
      el.setAttribute('aria-label', w.title || w.type);
      el.setAttribute('data-wid', w.id);
      var title = w.title ? '<h3>' + R.escapeHtml(w.title) + '</h3>' : '';
      if (d.error) { el.className += ' edv-quiet'; el.innerHTML = title + '<div class="edv-kpi-value">—</div><div class="edv-kpi-sub">Not measured: ' + R.escapeHtml(d.error) + '</div>'; root.appendChild(el); return; }
      if (w.type === 'text') { el.innerHTML = '<div class="edv-widget-text">' + R.miniMarkdown(w.markdown || '') + '</div>'; }
      else if (d.mode === 'single') {
        el.innerHTML = title + '<div class="edv-kpi-value">' + R.ragDot(d.rag, d.freshness) + R.formatValue(d.value, d.unit) + '</div>' +
          R.staleBadge(d) + R.kpiContext(d) +
          '<div class="edv-kpi-sub">' + (d.fleet ? (d.fleet.kind === 'unweighted_site_mean' ? 'average of site rates ' : 'fleet mean ') + R.formatValue(d.fleet.mean, d.unit) + ' (' + d.fleet.n + ' sites' + (d.fleet.kind === 'unweighted_site_mean' ? ', unweighted — not the group rate' : '') + ')' : (d.value == null ? 'not measured' : '')) + '</div>' +
          '<div class="edv-asof">' + (d.window ? R.escapeHtml(d.window.label) : '') + (d.partial ? ' · partial' : '') + '</div>' + R.partialNote(d);
      } else if (d.mode === 'series') {
        // design review B4 / R6: no empty axis; % axes run 0–100; short week labels, the year said once
        var pts = d.points || [];
        if (!pts.some(function (p) { return p.value != null; })) {
          el.className += ' edv-quiet';
          el.innerHTML = title + '<div class="edv-kpi-sub">Not measured over this period (' + pts.length + ' ' + (/W\d/.test(pts[0] && pts[0].label || '') ? 'weeks' : 'months') + ').</div>';
        } else {
          var years = {}; pts.forEach(function (p) { years[String(p.label).slice(0, 4)] = 1; });
          var vals = pts.filter(function (p) { return p.value != null; }); var last = vals[vals.length - 1];
          var lo = Math.min.apply(null, vals.map(function (p) { return Number(p.value); })), hi = Math.max.apply(null, vals.map(function (p) { return Number(p.value); }));
          var spoken = (w.title || w.metric) + ': latest ' + R.formatValue(last.value, d.unit) + ' (' + R.shortLabel(last.label) + '), low ' + R.formatValue(lo, d.unit) + ', high ' + R.formatValue(hi, d.unit) + (d.target != null ? ', target ' + R.formatValue(d.target, d.unit) : '') + (d.freshness && d.freshness !== 'FRESH' ? ', source not current' : '');
          var anyPartial = pts.some(function (p) { return p.partial; });
          var foot = R.staleBadge(d) + '<div class="edv-asof">' + Object.keys(years).join('–') + (d.window_end ? ' · window ends ' + R.escapeHtml(d.window_end) : '') + (anyPartial ? ' · last point partial (* = period still running)' : '') + (d.target != null ? ' · dashed line = target' + (d.target_from ? ' (version from ' + R.escapeHtml(d.target_from) + ')' : '') : '') + '</div>';
          // F13 — no chart library: the figures as a table, never an empty canvas
          if (!window.Chart) { el.innerHTML = title + '<div class="edv-kpi-sub">Chart unavailable — figures shown as a table.</div>' + R.seriesTableHtml(d) + foot; }
          else {
            el.innerHTML = title + '<canvas role="img" aria-label="' + R.escapeHtml(spoken) + '"></canvas>' + foot;
            var pct = String(d.unit) === '%';
            var stale = d.freshness && d.freshness !== 'FRESH';
            var PAL = ['#3A4A60', '#2563EB', '#0F766E', '#7C3AED', '#B45309'];
            var lines = d.lines && d.lines.length ? d.lines : [{ label: w.title || w.metric, points: pts }];
            var ds = lines.map(function (l, i) { return { label: l.label, data: (l.points || []).map(function (p) { return p.value; }), borderColor: stale ? '#9AA4B2' : PAL[i % PAL.length], backgroundColor: 'rgba(58,74,96,.12)', spanGaps: false, tension: .2, fill: lines.length === 1, pointRadius: 3 }; });
            // F06 — the target line follows each period's own target version
            var tline = pts.map(function (p) { return p.target !== undefined ? p.target : d.target; });
            var tIdx = -1; if (tline.some(function (v) { return v != null; })) { tIdx = ds.length; ds.push({ label: 'target', data: tline, borderColor: '#B45309', borderDash: [4, 4], pointRadius: 0, fill: false, stepped: true }); }
            var c = new Chart(el.querySelector('canvas'), { type: 'line', data: { labels: pts.map(function (p) { return R.shortLabel(p.label) + (p.partial ? '*' : ''); }), datasets: ds },
              options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: lines.length > 1 }, tooltip: { callbacks: { label: function (ctx) { var p = pts[ctx.dataIndex] || {}; if (ctx.datasetIndex === tIdx) return 'target ' + R.formatValue(ctx.parsed.y, d.unit) + (p.target_from ? ' (version from ' + p.target_from + ')' : ''); return R.formatValue(ctx.parsed.y, d.unit) + (p.partial ? ' (partial period)' : ''); } } } },
                scales: { x: { ticks: { maxRotation: 0, autoSkip: true } }, y: pct ? { min: 0, max: 100 } : { beginAtZero: true } } } });
            charts.push(c);
          }
        }
      } else if (d.mode === 'per-site') {
        // C-04 (F01): bar = labelled bar list, table = sortable table, ragGrid = RAG grid (unknown is grey);
        // a retired heatmap renders as a table with a notice
        bodies[w.id] = { type: w.type, d: d, title: title, el: el };
        el.innerHTML = title + R.perSiteHtml(w.type, d) + R.partialNote(d);
      } else if (d.mode === 'tracker') {
        el.innerHTML = title + R.trackerHtml(d);
      } else if (d.mode === 'actions') {
        el.innerHTML = title + (d.items.length ? '<table class="edv-actions-table"><thead><tr><th>Source</th><th>Action</th><th>Owner</th><th>Due</th></tr></thead><tbody>' +
          d.items.map(function (it) { return '<tr><td>' + R.escapeHtml(it.source) + '</td><td>' + R.escapeHtml(it.title || it.task || '') + '</td><td>' + R.escapeHtml(it.owner || '—') + '</td><td class="' + (it.overdue ? 'edv-overdue' : '') + '">' + R.escapeHtml(it.due_date || '—') + '</td></tr>'; }).join('') + '</tbody></table>'
          : '<div class="edv-kpi-sub">' + (d.note || 'No open action.') + '</div>') + '<div class="edv-asof">' + (d.totals ? d.totals.open + ' open in total' : '') + '</div>';
      } else el.innerHTML = title + '<div class="edv-kpi-sub">Widget type ' + R.escapeHtml(w.type) + ' is not rendered yet.</div>';
      root.appendChild(el);
    });
  }

  // C-04 — sortable table widgets: a header button re-renders that widget's table only
  $('dash').addEventListener('click', function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest('button.edv-sort') : null; if (!b) return;
    var sec = b.closest('section'); var id = sec && sec.getAttribute('data-wid'); var x = id && bodies[id]; if (!x) return;
    x.el.innerHTML = x.title + R.perSiteHtml(x.type, x.d, { col: b.getAttribute('data-sort'), dir: b.getAttribute('data-dir') }) + R.partialNote(x.d);
    var nb = x.el.querySelector('button.edv-sort[data-sort="' + b.getAttribute('data-sort') + '"]'); if (nb) nb.focus();
  });

  // design review R9: the period box suggests the last 13 weeks and 12 months
  try { R.windowSeries('week', 13).concat(R.windowSeries('month', 12)).reverse().forEach(function (v) { var o = document.createElement('option'); o.value = v; $('windowList').appendChild(o); }); } catch (_) {}
  $('apply').addEventListener('click', loadData);
  $('site').addEventListener('change', loadData);
  if (key) renderView(); else { $('dash').hidden = true; renderList(); }
})();
</script>
<!-- C-26 — French dictionary, INERT unless report_config ui_i18n_pages='1' (boot.js checks window.__uiPolicy). -->
<script nonce="%%CSP_NONCE%%" src="lib/i18nText.js"></script>
<script nonce="%%CSP_NONCE%%" src="lib/i18n/common.fr.js"></script>
<script nonce="%%CSP_NONCE%%" src="lib/i18n/dashboards.fr.js"></script>
<script nonce="%%CSP_NONCE%%" src="lib/i18n/boot.js" data-dict="I18N_FR_DASHBOARDS"></script>
</body>
</html>
